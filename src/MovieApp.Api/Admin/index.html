<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MovieApp demo editor</title>
<style>body{font:16px system-ui;max-width:850px;margin:40px auto;padding:0 20px;background:#f4f6fa;color:#182333}label{display:block;margin:15px 0}input,textarea,select,button{box-sizing:border-box;font:inherit;padding:10px;width:100%}textarea{min-height:120px}button{background:#184d8c;color:white;border:0;cursor:pointer;margin:12px 0}pre{white-space:pre-wrap}</style></head>
<body><h1>MovieApp demo editor</h1><p>Synthetic movies. Eligibility metadata cannot be edited. Administrator access is required to save.</p>
<label>Administrator key<input id="key" type="password" autocomplete="off"></label><small>The key stays in page memory, never browser storage.</small>
<label>Movie<select id="movies"></select></label><button id="load">Load movie</button>
<form id="editor"><label>Title<input id="title" required maxlength="200"></label><label>Overview<textarea id="overview" required maxlength="5000"></textarea></label><label>Release date<input id="date" type="date" required></label><label>Vote average<input id="vote" type="number" min="0" max="10" step="0.1" required></label><label>Genres (comma separated)<input id="genres" required></label><label>Poster HTTPS URL (empty clears it)<input id="poster" type="url"></label><button>Save changes</button></form><pre id="status" role="status"></pre><p><a href="/swagger">API documentation</a></p>
<script>
const el=id=>document.getElementById(id);let selectedId;
async function json(url,options){const response=await fetch(url,options);const body=await response.json();if(!response.ok)throw new Error(JSON.stringify(body,null,2));return {body,response};}
async function load(){selectedId=undefined;const id=el('movies').value;try{const {body:m}=await json('/api/movies/'+id);if(el('movies').value!==id)return;selectedId=m.id;el('title').value=m.title;el('overview').value=m.overview;el('date').value=m.releaseDate;el('vote').value=m.voteAverage;el('genres').value=m.genres.join(', ');el('poster').value=m.posterUrl||'';el('status').textContent='Loaded '+m.title;}catch(e){el('status').textContent=e.message;}}
el('load').onclick=load;
el('movies').onchange=load;
el('editor').onsubmit=async event=>{event.preventDefault();if(!selectedId)return;try{const {response}=await json('/api/movies/'+selectedId,{method:'PATCH',headers:{'Content-Type':'application/json','X-Admin-Key':el('key').value},body:JSON.stringify({title:el('title').value,overview:el('overview').value,releaseDate:el('date').value,voteAverage:Number(el('vote').value),genres:el('genres').value.split(',').map(x=>x.trim()),posterUrl:el('poster').value||null})});el('movies').selectedOptions[0].textContent=el('title').value;el('status').textContent='Saved. Notification: '+response.headers.get('X-Notification-Status')+'. Acceptance does not confirm device receipt.';}catch(e){el('status').textContent=e.message;}};
(async()=>{try{const {body}=await json('/api/movies?pageSize=100');for(const m of body.items){const option=document.createElement('option');option.value=m.id;option.textContent=m.title;el('movies').append(option);}await load();}catch(e){el('status').textContent=e.message;}})();
</script></body></html>
